name: Pac-Man contribution graph and streak card

# Draws Pac-Man eating your contribution graph and the pixel streak card, and puts the SVGs on the
# "output" branch, so the README can show them. The main branch is never touched by this workflow.
# Both are drawn in one run because the output branch is replaced as a whole on every publish.
# It redraws every hour, so new commits in any of your public repositories show up within about an hour.
# The output branch is replaced on every run (one commit only), so nothing piles up.
on:
  schedule:
    - cron: '17 * * * *' # every hour, at minute 17
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pacman
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the drawing tools
        uses: actions/checkout@v4

      - name: Draw the Pac-Man graphs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # The action draws in GitHub's own greys and greens and takes no colour options, so its SVGs are
      # recoloured here in the profile's Hutan palette (DESIGN.md), the same colours as the stats cards.
      # Dark: ink ground, four steps of forest green up to a bright leaf green, pale maze walls.
      # Light: paper ground, the same greens, ink walls. No target colour is also a source, so the order is safe.
      - name: Colour them in the Hutan palette
        run: |
          sed -i \
            -e 's/#0d1117/#121a14/Ig' -e 's/#161b22/#1b271e/Ig' \
            -e 's/#0e4429/#174f35/Ig' -e 's/#006d32/#1f6e44/Ig' -e 's/#26a641/#2f8a55/Ig' -e 's/#39d353/#52c879/Ig' \
            -e 's/#ffffff/#aab6a5/Ig' -e 's/#8b949e/#aab6a5/Ig' \
            dist/pacman-contribution-graph-dark.svg
          sed -i \
            -e 's/#ffffff/#eef0e6/Ig' -e 's/#ebedf0/#dde2d2/Ig' \
            -e 's/#9be9a8/#a9cf9a/Ig' -e 's/#40c463/#2f8a55/Ig' -e 's/#30a14e/#1f6e44/Ig' -e 's/#216e39/#0f3d2e/Ig' \
            -e 's/#000000/#121a14/Ig' -e 's/#57606a/#4f5b4d/Ig' \
            dist/pacman-contribution-graph.svg

      # The streak card is pixel art drawn by tools/streak.py from the public contribution calendar
      # (the same numbers the profile shows). If GitHub's page cannot be read, the run stops here and
      # the output branch keeps the last good card and graphs.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draw the streak card
        run: |
          pip install --quiet pillow fonttools
          python tools/streak.py --user ${{ github.repository_owner }} --out dist/streak.svg

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
